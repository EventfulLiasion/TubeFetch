[project]
name = "tubefetch"
version = "1.0.0"
description = "TubeFetch — polished YouTube media downloader (video/audio/playlists)"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2024.8.6",
  "PySide6>=6.7",
  "imageio-ffmpeg>=0.5.1",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
